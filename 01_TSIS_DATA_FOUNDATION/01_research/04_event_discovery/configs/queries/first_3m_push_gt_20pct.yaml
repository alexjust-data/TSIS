query_id: first_3m_push_gt_20pct
status: superseded
created_at: 2026-06-20
superseded_by: first_day_3bar_push_gt_20pct.yaml
do_not_use_for_current_event_discovery: true

purpose: >
  Find ticker-session candidates where the first three observed 1m bars of
  premarket or regular market show a price expansion greater than 20%.

supersession_reason: >
  The current research question is the first qualifying push of the ET day, not
  necessarily the first three observed bars of a session segment. Use
  first_day_3bar_push_gt_20pct.yaml for the active query.

data:
  operational_root: E:/TSIS/data
  dataset_family: ohlcv_1m
  dataset_root: E:/TSIS/data/ohlcv_1m
  price_view: raw_intraday_observed

session_segments:
  timezone: America/New_York
  premarket:
    start: "04:00"
    end: "09:30"
  regular:
    start: "09:30"
    end: "16:00"

candidate_rule:
  bars: 3
  metric: first_n_bars_high_return_pct
  threshold_pct: 20.0
  start_price: first_bar_open
  end_price: max_high_within_first_n_observed_bars
  max_window_minutes: 5.0
  min_start_price: 0.01

output:
  candidate_level: ticker_date_session
  runtime_root: C:/TSIS_Data/01_TSIS_DATA_FOUNDATION/01_research/04_event_discovery/runs
  fields:
    - candidate_id
    - query_id
    - ticker
    - local_date
    - session_segment
    - first_bar_ts_utc
    - trigger_ts_utc
    - last_bar_ts_utc
    - first_open
    - max_high
    - third_close
    - first_n_bars_high_return_pct
    - first_n_bars_close_return_pct
    - first_n_bars_volume
    - bars_observed
    - elapsed_minutes
    - source_path

non_goals:
  - This query does not define an institutional event.
  - This query does not define an entry.
  - This query does not define a stop.
  - This query does not define a target.
  - This query does not prove edge.
