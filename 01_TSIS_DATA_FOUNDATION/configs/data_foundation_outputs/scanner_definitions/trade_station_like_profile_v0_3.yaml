profile_id: trade_station_like_profile_v0_3
profile_version: v0_3
profile_family: daily_in_play
profile_name: trade_station_like_small_cap_momentum_visibility
profile_role: operational_visibility_replay
status: config_defined_not_officially_materialized

purpose:
  answers: "What would the operator likely have seen in a TradeStation-like top momentum hot list?"
  does_not_answer:
    - complete_candidate_universe
    - strategy_signal
    - final_market_state
    - label
    - reward
    - outcome

base_dependency:
  scanner_definition_id: base_eligible_smallcap_denominator_v0_3
  rule: may_only_select_rows_that_pass_base_eligible_denominator

hard_filters:
  volume_today_min: 500000
  pct_chg_1d_required_for_ranking: true

ranking:
  primary_metric: pct_chg_1d
  primary_order: desc
  tie_breakers:
    - dollar_volume_today_desc
    - ticker_asc
  top_n: 25

output_flags:
  - selected_trade_station_like_profile
  - selected_trade_station_like_top25

notes:
  - "volume_today >= 500k is preserved only for operational visibility replay."
  - "It is not the in-play momentum denominator by itself."
  - "This profile answers what the operator likely saw; selected_in_play_momentum_candidate defines what passed the governed in-play gate."
