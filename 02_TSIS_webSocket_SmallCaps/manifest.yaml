      - premarket
      - regular_market
      - afterhours
    market_cap_usd_lt: 100000000
    price_usd_min: 0.50
    price_usd_max: 20.00
    min_volume_shares: 300000
    volume_source_priority:
      - das_lv1_V
      - das_time_and_sales_sum_if_capture_window_complete
      - unavailable_record_null
    market_cap_source: governed_tsis_reference_or_universe_until_das_field_is_proven
  hard_blocked_prefixes:
    - NEWORDER
    - REPLACE
    - CANCEL
    - CANCEL ALL
    - COMPLEXORDER
    - SLNEWORDER
    - SLCANCELORDER
    - SLOFFEROPERATION
